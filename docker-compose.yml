version: '3.8'

services:
  backend:
    build:
      context: .
    container_name: rimonim_backend
    command: gunicorn --bind 0.0.0.0:8000 rimonim.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: rimonim_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rimonim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-rimonim_db}

  nginx:
    image: nginx:latest
    container_name: rimonim_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: