version: '3.8'

services:
  backend:
    build:
      context: .
    container_name: rimonim_backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-default_secret_key}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-test_db}
      DB_USER: ${DB_USER:-test_user}
      DB_PASSWORD: ${DB_PASSWORD:-securepassword}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SETTINGS_MODULE: rimonim.settings.base
    volumes:
      - .:/app
      - ./static:/app/static
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: rimonim_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rimonim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-rimonim_db}
    ports:
      - "5432:5432"

  nginx:
    image: nginx:latest
    container_name: rimonim_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: