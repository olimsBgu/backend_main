version: '3.8'

services:
  backend:
    image: mihsemen/rimonim-backend:latest
    container_name: rimonim_backend
    env_file:
      - .env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: rimonim_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  nginx:
    image: nginx:latest
    container_name: rimonim_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data: