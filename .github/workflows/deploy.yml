name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH for DigitalOcean
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          rsync -avz -e "ssh -i ~/.ssh/private_key" --exclude='.git' --exclude='.gitignore' ./ root@${{ secrets.SERVER_IP }}:/app
          ssh -i ~/.ssh/private_key root@${{ secrets.SERVER_IP }} "
            export DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}' &&
            export DB_HOST='${{ secrets.DB_HOST }}' &&
            export DB_NAME='${{ secrets.DB_NAME }}' &&
            export DB_USER='${{ secrets.DB_USER }}' &&
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}' &&
            export DEBUG='${{ secrets.DEBUG }}' &&
            export ALLOWED_HOSTS='${{ secrets.ALLOWED_HOSTS }}' &&
            cd /app &&
            docker-compose down &&
            docker-compose up -d --build
          "