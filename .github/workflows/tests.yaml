name: CI - Test Suite
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: rimonim_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: rimonim_db
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=securepassword psql -h localhost -U rimonim_user -d postgres -c "CREATE DATABASE rimonim_db;"

      - name: Run migrations
        run: |
          python manage.py migrate --settings=rimonim.settings.test
          sleep 5

      - name: Run pytest
        run: |
          pytest --ds=rimonim.settings.test --maxfail=5 --disable-warnings
